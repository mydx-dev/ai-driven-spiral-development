version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-dependencies:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /packages/github
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /packages/standard
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /packages/standard-github
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /packages/quality
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /packages/cli
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
