name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  security:
    name: Security Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.18.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24

      - name: Repository security checks
        run: node scripts/security-gate.mjs

      - name: Scan secrets with TruffleHog
        env:
          TRUFFLEHOG_VERSION: 3.97.1
          TRUFFLEHOG_SHA256: f863ea3a8d786f7d097870496c977944cce7372a2fe1e56707d965016e543ece
        run: |
          ARCHIVE="trufflehog_${TRUFFLEHOG_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/trufflesecurity/trufflehog/releases/download/v${TRUFFLEHOG_VERSION}/${ARCHIVE}" \
            --output "/tmp/${ARCHIVE}"
          echo "${TRUFFLEHOG_SHA256}  /tmp/${ARCHIVE}" | sha256sum --check --strict
          tar -xzf "/tmp/${ARCHIVE}" -C /tmp trufflehog

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            SINCE_COMMIT="${{ github.event.pull_request.base.sha }}"
          else
            SINCE_COMMIT="HEAD^"
          fi

          /tmp/trufflehog git file://. \
            --since-commit "$SINCE_COMMIT" \
            --branch HEAD \
            --results=verified,unknown \
            --fail \
            --no-update

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f5948dfacef28e207b48d0905cf90c03365536d
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@6f5948dfacef28e207b48d0905cf90c03365536d

  ci:
    needs:
      - security
      - codeql
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.18.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Test
        run: pnpm test

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Build Core
        run: pnpm build

      - name: Install GitHub package dependencies
        run: pnpm --dir packages/github install --no-frozen-lockfile --ignore-scripts

      - name: Test GitHub package
        run: pnpm --dir packages/github test

      - name: Type check GitHub package
        run: pnpm --dir packages/github typecheck

      - name: Build GitHub package
        run: pnpm --dir packages/github build

      - name: Install Quality package dependencies
        run: pnpm --dir packages/quality install --no-frozen-lockfile --ignore-scripts

      - name: Test Quality package
        run: pnpm --dir packages/quality test

      - name: Type check Quality package
        run: pnpm --dir packages/quality typecheck

      - name: Build Quality package
        run: pnpm --dir packages/quality build

      - name: Test CLI package
        run: pnpm --dir packages/cli test

      - name: Type check CLI package
        run: pnpm --dir packages/cli typecheck

      - name: Build CLI package
        run: pnpm --dir packages/cli build

      - name: Verify CLI publish manifest
        run: |
          cd packages/cli
          npm pkg fix
          git diff --exit-code -- package.json
          npm pack --dry-run

      - name: Verify Standard package standalone
        run: |
          CORE_TARBALL_DIR="$(mktemp -d)"
          pnpm pack --pack-destination "$CORE_TARBALL_DIR"
          CORE_TARBALL="$(find "$CORE_TARBALL_DIR" -maxdepth 1 -name '*.tgz' -print -quit)"

          VERIFY_ROOT="$(mktemp -d)"
          tar -xzf "$CORE_TARBALL" -C "$VERIFY_ROOT" --strip-components=1
          mkdir -p "$VERIFY_ROOT/packages/standard"
          cp -R packages/standard/. "$VERIFY_ROOT/packages/standard/"
          rm -rf "$VERIFY_ROOT/packages/standard/node_modules" "$VERIFY_ROOT/packages/standard/dist"

          cd "$VERIFY_ROOT/packages/standard"
          pnpm install --no-frozen-lockfile --ignore-scripts
          pnpm test
          pnpm typecheck
          pnpm build

      - name: Build Standard package for Binding
        run: |
          pnpm --dir packages/standard install --no-frozen-lockfile --ignore-scripts
          pnpm --dir packages/standard build

      - name: Install Standard GitHub package dependencies
        run: pnpm --dir packages/standard-github install --no-frozen-lockfile --ignore-scripts

      - name: Test Standard GitHub package
        run: pnpm --dir packages/standard-github test

      - name: Type check Standard GitHub package
        run: pnpm --dir packages/standard-github typecheck

      - name: Build Standard GitHub package
        run: pnpm --dir packages/standard-github build

      - name: Verify Standard GitHub publish manifest
        run: |
          cd packages/standard-github
          npm pkg fix
          git diff --exit-code -- package.json
          npm pack --dry-run

      - name: Verify all public package contents
        run: |
          npm pack --dry-run
          npm --prefix packages/github pack --dry-run
          npm --prefix packages/standard pack --dry-run
          npm --prefix packages/standard-github pack --dry-run
          npm --prefix packages/quality pack --dry-run
          npm --prefix packages/cli pack --dry-run
