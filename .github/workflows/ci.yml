name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Apply CLI formatting
        run: |
          git fetch origin feature/23-portable-cli
          git checkout -B feature/23-portable-cli FETCH_HEAD
          pnpm prettier packages/cli/cli.spec.mjs packages/cli/package.json packages/cli/src/init.mjs packages/cli/src/registry.mjs --write
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/cli
          git commit -m "style: CLI packageをPrettierで整形する"
          git push origin HEAD:feature/23-portable-cli
          exit 1

      - name: Format check
        run: pnpm format:check

      - name: Build Core
        run: pnpm build

      - name: Test GitHub package
        run: pnpm --dir packages/github test

      - name: Type check GitHub package
        run: pnpm --dir packages/github typecheck

      - name: Build GitHub package
        run: pnpm --dir packages/github build

      - name: Install Quality package dependencies
        run: pnpm --dir packages/quality install --no-frozen-lockfile

      - name: Test Quality package
        run: pnpm --dir packages/quality test

      - name: Type check Quality package
        run: pnpm --dir packages/quality typecheck

      - name: Build Quality package
        run: pnpm --dir packages/quality build

      - name: Test CLI package
        run: pnpm --dir packages/cli test

      - name: Type check CLI package
        run: pnpm --dir packages/cli typecheck

      - name: Build CLI package
        run: pnpm --dir packages/cli build
