name: Publish

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

jobs:
  check-versions:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      publish-core: ${{ steps.versions.outputs.publish-core }}
      publish-github: ${{ steps.versions.outputs.publish-github }}
      publish-standard: ${{ steps.versions.outputs.publish-standard }}
      publish-standard-github: ${{ steps.versions.outputs.publish-standard-github }}
      publish-quality: ${{ steps.versions.outputs.publish-quality }}
      publish-cli: ${{ steps.versions.outputs.publish-cli }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Check package versions
        id: versions
        run: |
          check_package() {
            local output="$1"
            local manifest="$2"
            local name
            local version
            name=$(node -p "require('./${manifest}').name")
            version=$(node -p "require('./${manifest}').version")
            echo "${name}@${version}"
            if npm view "${name}@${version}" version > /dev/null 2>&1; then
              echo "${output}=false" >> "$GITHUB_OUTPUT"
            else
              echo "${output}=true" >> "$GITHUB_OUTPUT"
            fi
          }

          check_package publish-core package.json
          check_package publish-github packages/github/package.json
          check_package publish-standard packages/standard/package.json
          check_package publish-standard-github packages/standard-github/package.json
          check_package publish-quality packages/quality/package.json
          check_package publish-cli packages/cli/package.json

  publish:
    needs: check-versions
    if: ${{ needs.check-versions.outputs.publish-core == 'true' || needs.check-versions.outputs.publish-github == 'true' || needs.check-versions.outputs.publish-standard == 'true' || needs.check-versions.outputs.publish-standard-github == 'true' || needs.check-versions.outputs.publish-quality == 'true' || needs.check-versions.outputs.publish-cli == 'true' }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install root dependencies
        if: ${{ needs.check-versions.outputs.publish-core == 'true' || needs.check-versions.outputs.publish-standard == 'true' || needs.check-versions.outputs.publish-standard-github == 'true' || needs.check-versions.outputs.publish-cli == 'true' }}
        run: pnpm install --frozen-lockfile

      - name: Build Core
        if: ${{ needs.check-versions.outputs.publish-core == 'true' || needs.check-versions.outputs.publish-standard == 'true' || needs.check-versions.outputs.publish-standard-github == 'true' }}
        run: pnpm build

      - name: Verify Core package contents
        if: ${{ needs.check-versions.outputs.publish-core == 'true' }}
        run: npm pack --dry-run

      - name: Publish Core
        if: ${{ needs.check-versions.outputs.publish-core == 'true' }}
        run: npm publish --provenance --access public

      - name: Install GitHub dependencies
        if: ${{ needs.check-versions.outputs.publish-github == 'true' || needs.check-versions.outputs.publish-standard-github == 'true' }}
        run: pnpm --dir packages/github install --no-frozen-lockfile

      - name: Build GitHub
        if: ${{ needs.check-versions.outputs.publish-github == 'true' || needs.check-versions.outputs.publish-standard-github == 'true' }}
        run: pnpm --dir packages/github build

      - name: Verify GitHub package contents
        if: ${{ needs.check-versions.outputs.publish-github == 'true' }}
        working-directory: packages/github
        run: npm pack --dry-run

      - name: Publish GitHub
        if: ${{ needs.check-versions.outputs.publish-github == 'true' }}
        working-directory: packages/github
        run: npm publish --provenance --access public

      - name: Install Standard dependencies
        if: ${{ needs.check-versions.outputs.publish-standard == 'true' || needs.check-versions.outputs.publish-standard-github == 'true' }}
        run: pnpm --dir packages/standard install --no-frozen-lockfile

      - name: Build Standard
        if: ${{ needs.check-versions.outputs.publish-standard == 'true' || needs.check-versions.outputs.publish-standard-github == 'true' }}
        run: pnpm --dir packages/standard build

      - name: Verify Standard package contents
        if: ${{ needs.check-versions.outputs.publish-standard == 'true' }}
        working-directory: packages/standard
        run: npm pack --dry-run

      - name: Publish Standard
        if: ${{ needs.check-versions.outputs.publish-standard == 'true' }}
        working-directory: packages/standard
        run: npm publish --provenance --access public

      - name: Install Standard GitHub dependencies
        if: ${{ needs.check-versions.outputs.publish-standard-github == 'true' }}
        run: pnpm --dir packages/standard-github install --no-frozen-lockfile

      - name: Build Standard GitHub
        if: ${{ needs.check-versions.outputs.publish-standard-github == 'true' }}
        run: pnpm --dir packages/standard-github build

      - name: Verify Standard GitHub package contents
        if: ${{ needs.check-versions.outputs.publish-standard-github == 'true' }}
        working-directory: packages/standard-github
        run: npm pack --dry-run

      - name: Publish Standard GitHub
        if: ${{ needs.check-versions.outputs.publish-standard-github == 'true' }}
        working-directory: packages/standard-github
        run: npm publish --provenance --access public

      - name: Install Quality dependencies
        if: ${{ needs.check-versions.outputs.publish-quality == 'true' }}
        run: pnpm --dir packages/quality install --no-frozen-lockfile

      - name: Build Quality
        if: ${{ needs.check-versions.outputs.publish-quality == 'true' }}
        run: pnpm --dir packages/quality build

      - name: Verify Quality package contents
        if: ${{ needs.check-versions.outputs.publish-quality == 'true' }}
        working-directory: packages/quality
        run: npm pack --dry-run

      - name: Publish Quality
        if: ${{ needs.check-versions.outputs.publish-quality == 'true' }}
        working-directory: packages/quality
        run: npm publish --provenance --access public

      - name: Build CLI
        if: ${{ needs.check-versions.outputs.publish-cli == 'true' }}
        run: pnpm --dir packages/cli build

      - name: Verify CLI package contents
        if: ${{ needs.check-versions.outputs.publish-cli == 'true' }}
        working-directory: packages/cli
        run: npm pack --dry-run

      - name: Publish CLI
        if: ${{ needs.check-versions.outputs.publish-cli == 'true' }}
        working-directory: packages/cli
        run: npm publish --provenance --access public

  verify-published-cli:
    needs:
      - check-versions
      - publish
    if: ${{ always() && needs.check-versions.result == 'success' && (needs.publish.result == 'success' || needs.publish.result == 'skipped') }}
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Verify published CLI against npm registry
        run: |
          CLI_VERSION=$(node -p "require('./packages/cli/package.json').version")
          STANDARD_GITHUB_VERSION=$(node -p "require('./packages/standard-github/package.json').version")
          TARGET_DIR="$(mktemp -d)"
          CUSTOM_DIR="$(mktemp -d)"

          wait_for_package() {
            local package="$1"
            local version="$2"
            for ATTEMPT in $(seq 1 18); do
              if pnpm view "${package}@${version}" version \
                --registry=https://registry.npmjs.org/ 2>/dev/null | grep -Fx "$version"; then
                return
              fi

              if [ "$ATTEMPT" -eq 18 ]; then
                echo "${package}@${version} is not visible from npm registry"
                exit 1
              fi

              sleep 5
            done
          }

          wait_for_package "@mydx-dev/spiral" "$CLI_VERSION"
          wait_for_package "@mydx-dev/spiral-standard-github" "$STANDARD_GITHUB_VERSION"

          pnpm dlx "@mydx-dev/spiral@${CLI_VERSION}" init \
            --artifact github \
            --process standard \
            --quality \
            --cwd "$TARGET_DIR"

          test -f "$TARGET_DIR/scripts/spiral/main.mjs"
          test -f "$TARGET_DIR/scripts/spiral/execution-channel.mjs"
          test ! -e "$TARGET_DIR/src/spiral"
          test -f "$TARGET_DIR/.github/ISSUE_TEMPLATE/spiral-cycle.md"
          test -f "$TARGET_DIR/.github/ISSUE_TEMPLATE/demand.md"
          test -f "$TARGET_DIR/.github/ISSUE_TEMPLATE/feature.md"
          test ! -e "$TARGET_DIR/.github/ISSUE_TEMPLATE/spiral-artifact.md"
          grep -F '## 要件' "$TARGET_DIR/.github/ISSUE_TEMPLATE/demand.md"
          grep -F '## 対象要件' "$TARGET_DIR/.github/ISSUE_TEMPLATE/feature.md"
          grep -F '## Release' "$TARGET_DIR/.github/ISSUE_TEMPLATE/spiral-cycle.md"
          grep -F '"executionChannel": "./scripts/spiral/execution-channel.mjs"' "$TARGET_DIR/spiral.config.mjs"

          node - "$TARGET_DIR/package.json" <<'NODE'
          const fs = require('node:fs');
          const packageJson = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const expectedDependencies = [
            '@mydx-dev/ai-driven-spiral-development',
            '@mydx-dev/spiral-github',
            '@mydx-dev/spiral-standard',
            '@mydx-dev/spiral-standard-github',
          ];
          for (const name of expectedDependencies) {
            if (!packageJson.dependencies?.[name]) {
              throw new Error(`missing dependency: ${name}`);
            }
          }
          if (!packageJson.devDependencies?.['@mydx-dev/spiral-quality']) {
            throw new Error('missing devDependency: @mydx-dev/spiral-quality');
          }
          NODE

          pnpm --dir "$TARGET_DIR" install --no-frozen-lockfile

          SECOND_RUN=$(pnpm dlx "@mydx-dev/spiral@${CLI_VERSION}" init \
            --artifact github \
            --process standard \
            --quality \
            --cwd "$TARGET_DIR")
          echo "$SECOND_RUN"
          echo "$SECOND_RUN" | grep -F "Portable Distribution is already satisfied."

          pnpm dlx "@mydx-dev/spiral@${CLI_VERSION}" init \
            --artifact github \
            --process custom \
            --cwd "$CUSTOM_DIR"
          test -f "$CUSTOM_DIR/.github/ISSUE_TEMPLATE/spiral-artifact.md"
          test ! -e "$CUSTOM_DIR/.github/ISSUE_TEMPLATE/demand.md"
          test ! -e "$CUSTOM_DIR/.github/ISSUE_TEMPLATE/feature.md"
