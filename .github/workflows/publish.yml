name: Publish

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

jobs:
  check-versions:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      publish-core: ${{ steps.versions.outputs.publish-core }}
      publish-github: ${{ steps.versions.outputs.publish-github }}
      publish-standard: ${{ steps.versions.outputs.publish-standard }}
      publish-standard-github: ${{ steps.versions.outputs.publish-standard-github }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Check package versions
        id: versions
        run: |
          check_package() {
            local output="$1"
            local manifest="$2"
            local name
            local version
            name=$(node -p "require('./${manifest}').name")
            version=$(node -p "require('./${manifest}').version")
            echo "${name}@${version}"
            if npm view "${name}@${version}" version > /dev/null 2>&1; then
              echo "${output}=false" >> "$GITHUB_OUTPUT"
            else
              echo "${output}=true" >> "$GITHUB_OUTPUT"
            fi
          }

          check_package publish-core package.json
          check_package publish-github packages/github/package.json
          check_package publish-standard packages/standard/package.json
          check_package publish-standard-github packages/standard-github/package.json

  publish:
    needs: check-versions
    if: ${{ needs.check-versions.outputs.publish-core == 'true' || needs.check-versions.outputs.publish-github == 'true' || needs.check-versions.outputs.publish-standard == 'true' || needs.check-versions.outputs.publish-standard-github == 'true' }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install Core dependencies
        if: ${{ needs.check-versions.outputs.publish-core == 'true' }}
        run: pnpm install --frozen-lockfile

      - name: Build Core
        if: ${{ needs.check-versions.outputs.publish-core == 'true' }}
        run: pnpm build

      - name: Verify Core package contents
        if: ${{ needs.check-versions.outputs.publish-core == 'true' }}
        run: npm pack --dry-run

      - name: Publish Core
        if: ${{ needs.check-versions.outputs.publish-core == 'true' }}
        run: npm publish --provenance --access public

      - name: Install GitHub dependencies
        if: ${{ needs.check-versions.outputs.publish-github == 'true' || needs.check-versions.outputs.publish-standard-github == 'true' }}
        run: pnpm --dir packages/github install --no-frozen-lockfile

      - name: Build GitHub
        if: ${{ needs.check-versions.outputs.publish-github == 'true' || needs.check-versions.outputs.publish-standard-github == 'true' }}
        run: pnpm --dir packages/github build

      - name: Verify GitHub package contents
        if: ${{ needs.check-versions.outputs.publish-github == 'true' }}
        working-directory: packages/github
        run: npm pack --dry-run

      - name: Publish GitHub
        if: ${{ needs.check-versions.outputs.publish-github == 'true' }}
        working-directory: packages/github
        run: npm publish --provenance --access public

      - name: Install Standard dependencies
        if: ${{ needs.check-versions.outputs.publish-standard == 'true' || needs.check-versions.outputs.publish-standard-github == 'true' }}
        run: pnpm --dir packages/standard install --no-frozen-lockfile

      - name: Build Standard
        if: ${{ needs.check-versions.outputs.publish-standard == 'true' || needs.check-versions.outputs.publish-standard-github == 'true' }}
        run: pnpm --dir packages/standard build

      - name: Verify Standard package contents
        if: ${{ needs.check-versions.outputs.publish-standard == 'true' }}
        working-directory: packages/standard
        run: npm pack --dry-run

      - name: Publish Standard
        if: ${{ needs.check-versions.outputs.publish-standard == 'true' }}
        working-directory: packages/standard
        run: npm publish --provenance --access public

      - name: Install Standard GitHub dependencies
        if: ${{ needs.check-versions.outputs.publish-standard-github == 'true' }}
        run: pnpm --dir packages/standard-github install --no-frozen-lockfile

      - name: Build Standard GitHub
        if: ${{ needs.check-versions.outputs.publish-standard-github == 'true' }}
        run: pnpm --dir packages/standard-github build

      - name: Verify Standard GitHub package contents
        if: ${{ needs.check-versions.outputs.publish-standard-github == 'true' }}
        working-directory: packages/standard-github
        run: npm pack --dry-run

      - name: Publish Standard GitHub
        if: ${{ needs.check-versions.outputs.publish-standard-github == 'true' }}
        working-directory: packages/standard-github
        run: npm publish --provenance --access public
