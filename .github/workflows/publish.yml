name: Publish

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

jobs:
  check-versions:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      publish-core: ${{ steps.versions.outputs.publish-core }}
      publish-standard: ${{ steps.versions.outputs.publish-standard }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Check package versions
        id: versions
        run: |
          CORE_NAME=$(node -p "require('./package.json').name")
          CORE_VERSION=$(node -p "require('./package.json').version")
          STANDARD_NAME=$(node -p "require('./packages/standard/package.json').name")
          STANDARD_VERSION=$(node -p "require('./packages/standard/package.json').version")

          echo "Core: ${CORE_NAME}@${CORE_VERSION}"
          echo "Standard: ${STANDARD_NAME}@${STANDARD_VERSION}"

          if npm view "${CORE_NAME}@${CORE_VERSION}" version > /dev/null 2>&1; then
            echo "publish-core=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish-core=true" >> "$GITHUB_OUTPUT"
          fi

          if npm view "${STANDARD_NAME}@${STANDARD_VERSION}" version > /dev/null 2>&1; then
            echo "publish-standard=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish-standard=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: check-versions
    if: ${{ needs.check-versions.outputs.publish-core == 'true' || needs.check-versions.outputs.publish-standard == 'true' }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install Core dependencies
        if: ${{ needs.check-versions.outputs.publish-core == 'true' }}
        run: pnpm install --frozen-lockfile

      - name: Build Core
        if: ${{ needs.check-versions.outputs.publish-core == 'true' }}
        run: pnpm build

      - name: Verify Core package contents
        if: ${{ needs.check-versions.outputs.publish-core == 'true' }}
        run: npm pack --dry-run

      - name: Publish Core
        if: ${{ needs.check-versions.outputs.publish-core == 'true' }}
        run: npm publish --provenance --access public

      - name: Install Standard dependencies
        if: ${{ needs.check-versions.outputs.publish-standard == 'true' }}
        run: pnpm --dir packages/standard install --no-frozen-lockfile

      - name: Build Standard
        if: ${{ needs.check-versions.outputs.publish-standard == 'true' }}
        run: pnpm --dir packages/standard build

      - name: Verify Standard package contents
        if: ${{ needs.check-versions.outputs.publish-standard == 'true' }}
        working-directory: packages/standard
        run: npm pack --dry-run

      - name: Publish Standard
        if: ${{ needs.check-versions.outputs.publish-standard == 'true' }}
        working-directory: packages/standard
        run: npm publish --provenance --access public
